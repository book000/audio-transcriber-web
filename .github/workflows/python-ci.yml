name: Python CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  merge_group:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-ci:
    name: Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    uses: book000/templates/.github/workflows/reusable-python-ci.yml@master
    with:
      python-version: ${{ matrix.python-version }}
